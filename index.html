<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>leto talks — рейтинги учителей</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23214E8A'/><text x='50' y='60' font-size='60' text-anchor='middle' fill='%23FFC237'>L</text></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="На главную">
      <div class="brand-icon">L</div>
      <div class="brand-text">leto<span>talks</span></div>
    </a>

    <div class="search-group">
      <input id="searchInput" type="search" placeholder="Поиск учителя (имя, фамилия)"/>
      <button id="searchBtn" class="btn primary" aria-label="Поиск">Найти</button>
    </div>

    <div class="filters">
      <!-- Кастомный выпадающий список кафедр -->
      <div class="select custom-select" id="deptSelectWrap">
        <button id="deptBtn" class="select-btn" type="button" aria-haspopup="listbox" aria-expanded="false">Кафедры…</button>
        <div id="deptMenu" class="select-menu hidden" role="listbox" aria-label="Кафедры"></div>
      </div>

      <!-- Логин/логаут -->
      <button id="loginBtn" class="btn outline">Войти</button>
      <div id="userBadge" class="badge hidden">Student</div>
      <button id="logoutBtn" class="btn small outline hidden" type="button">Выйти</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div>© <span id="year"></span> leto talks</div>
    <div class="muted">
      <a class="link" href="#/policy">Правила, конфиденциальность и отказ от ответственности</a>
    </div>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
