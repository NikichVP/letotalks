<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#214e8a"/>
  <meta name="description" content="leto talks — отзывы и оценки учителей от учеников."/>
  <title>leto talks — рейтинги учителей</title>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23214E8A'/><text x='50' y='68' font-size='60' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23FFC237'>L</text></svg>">
</head>
<body class="lockout">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="leto talks — на главную">
      <div class="brand-icon" aria-hidden="true">L</div>
      <div class="brand-text">leto<span>talks</span></div>
    </a>

    <form class="search-group" id="searchForm" role="search">
      <input id="searchInput" class="input" type="search" placeholder="Поиск учителя" aria-label="Поиск учителя" autocomplete="off"/>
      <button class="btn primary" type="submit">Найти</button>
    </form>

    <div class="filters">
      <!-- Выпадающий список кафедр (навигация) -->
      <div class="custom-select" id="deptSelectWrap">
        <button id="deptBtn" class="select-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="deptMenu">Кафедры…</button>
        <div id="deptMenu" class="select-menu hidden" aria-label="Кафедры"></div>
      </div>

      <a id="shopLink" class="btn outline hidden" href="#/shop">Магазин</a>
      <a id="adminLink" class="btn outline hidden" href="#/admin">Админка</a>
      <!-- Аккаунт: наведение или клик открывает меню с балансом и «Выйти». -->
      <button id="userBadge" class="user-badge hidden" type="button" aria-haspopup="dialog" aria-expanded="false">Аккаунт</button>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div>© <span id="year"></span> leto talks — студенческий проект, не связан с администрацией школы</div>
    <div class="footer-links">
      <a class="link" href="#/policy">Правила и конфиденциальность</a>
      <a class="link" href="#/teacher-request">Предложить учителя</a>
      <a class="link" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">Создатели проекта</a>
    </div>
  </footer>

  <script src="/profanity.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
